name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check Supabase connection
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_ANON_KEY is not configured"
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "https://amzhcswgydpuiyyhoxiq.supabase.co/rest/v1/inventory_items?select=id&limit=1" \
            -o /dev/null
