<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スイミング用品・在庫管理 Cloud</title><meta name="theme-color" content="#0877bd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="在庫管理">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f7fb;color:#123}header{background:linear-gradient(135deg,#0877bd,#05a5d9);color:#fff;padding:22px 18px}header h1{font-size:22px;margin:0 0 5px}.wrap{max-width:1050px;margin:auto;padding:16px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 12px #0b4d7020}.kpi b{font-size:25px;color:#0877bd}.tabs{display:flex;gap:8px;margin:16px 0;overflow:auto}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#dfeef8;color:#075f96;font-weight:700}.tabs button.on,.btn.primary{background:#0877bd;color:#fff}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar input,.toolbar select,input[type=number]{padding:10px;border:1px solid #c9dbe7;border-radius:9px;background:#fff}.toolbar input{flex:1}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th{background:#e7f4fb;color:#075f96;text-align:left}th,td{padding:10px;border-bottom:1px solid #e8eef2}td.num{text-align:center}.low{background:#fff2cc}.zero{background:#ffdada;color:#a40000;font-weight:700}.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.hope{background:#fff1bf}.confirmed{background:#d9ecff}.done{background:#d9f5e3}.panel{display:none}.panel.on{display:block}.reqgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 4px}select,input{width:100%}.muted{color:#607786;font-size:13px}.history{margin-top:12px}.alertbox{margin:12px 0;padding:12px;border-radius:12px;background:#fff7d6}.cartrow{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e8eef2}.schoolcards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.schoolcard{background:#fff;border-radius:12px;padding:12px;border:1px solid #dbe8f0}.danger{background:#ffe1e1!important;color:#a40000!important}.right{text-align:right}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.reqgrid{grid-template-columns:1fr}table{font-size:13px}th,td{padding:8px 5px}.hide-sm{display:none}}</style></head><body><header><div class="wrap"><h1>🏊 スイミング用品・在庫管理 Cloud</h1><div>在庫管理 ｜ 各所属 希望数共有</div></div><div class="wrap" style="padding-top:0"><span id="cloudStatus" style="font-size:12px;opacity:.9">☁️ Cloud接続確認中...</span></div></header><main class="wrap"><section class="kpis"><div class="card kpi"><span>総在庫数</span><br><b id="totalStock">0</b></div><div class="card kpi"><span>希望数</span><br><b id="hopeCount">0</b></div><div class="card kpi"><span>在庫不足</span><br><b id="shortCount">0</b></div><div class="card kpi"><span>未処理</span><br><b id="pendingCount">0</b></div></section><div class="tabs"><button class="on" data-tab="inventory">在庫一覧</button><button data-tab="request">希望入力</button><button data-tab="manage">在庫管理</button><button data-tab="history">履歴</button></div><section id="inventory" class="panel on"><div class="toolbar"><input id="search" placeholder="品目・サイズを検索"><select id="filter"><option value="all">すべて</option><option value="low">残り2以下</option><option value="zero">在庫なし</option><option value="requested">希望あり</option></select></div><div style="overflow:auto"><table><thead><tr><th>品目</th><th>サイズ・種類</th><th>現在庫</th><th>希望</th><th>残見込み</th></tr></thead><tbody id="invBody"></tbody></table></div></section><section id="request" class="panel"><div class="card"><h2>各所属 希望入力</h2><p class="muted">複数の商品をカートに追加して、まとめて送信できます。</p><div class="reqgrid"><div><label>所属</label><select id="school"><option>竜王校</option><option>青葉校</option><option>甲府校</option><option>塩山校</option></select></div><div><label>品目</label><select id="product"></select></div><div><label>サイズ・種類</label><select id="variant"></select></div><div><label>希望数</label><input id="qty" type="number" min="1" value="1"></div></div><label>メモ</label><input id="memo" placeholder="任意"><p class="muted">入力後は「希望」として管理画面に表示されます。</p><button class="btn" onclick="addToCart()">＋ カートに追加</button><h3>希望カート</h3><div id="cartBody" class="muted">まだ商品はありません。</div><div class="right" style="margin-top:10px"><button class="btn primary" onclick="submitCart()">まとめて希望を送信</button></div></div></section><section id="manage" class="panel"><div id="alerts" class="alertbox"></div><div class="card"><h2>在庫管理・受渡しチェック</h2><p class="muted">希望 → 確定 → 受渡済。受渡済にすると在庫から自動で差し引きます。</p><div style="overflow:auto"><table><thead><tr><th>所属</th><th>品目</th><th>種類</th><th>数</th><th>状態</th><th>操作</th></tr></thead><tbody id="manageBody"></tbody></table></div></div></section><section id="history" class="panel"><div class="card"><h2>所属別 集計</h2><div id="schoolSummary" class="schoolcards"></div></div><div class="card" style="margin-top:12px"><h2>入出庫・受渡履歴</h2><div id="historyBody" class="history"></div></div></section></main><script>
const SUPABASE_URL='https://amzhcswgydpuiyyhoxiq.supabase.co';
const SUPABASE_KEY='sb_publishable_bsLTl1RZilhI2ofTDrS5hQ_CctZPLdf';
const H={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
let inventory=[], requests=[], histories=[], affiliations=[], cart=[];
const $=id=>document.getElementById(id);
async function api(path,opt={}){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opt,headers:{...H,...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function loadAll(){try{
 [inventory,affiliations]=await Promise.all([api('inventory_items?select=*&order=sort_order.asc'),api('affiliations?select=*&active=eq.true&order=sort_order.asc')]);
 requests=await api('requests?select=*,affiliations(name),inventory_items(item_name,variant)&order=created_at.desc');
 histories=await api('inventory_history?select=*,inventory_items(item_name,variant)&order=created_at.desc');
 inventory=inventory.map(x=>({...x,item:x.item_name})); setupAffiliations();setupProducts();render();
 $('cloudStatus').textContent='☁️ Cloud接続中';
}catch(e){console.error(e);$('cloudStatus').textContent='⚠️ Cloud接続エラー';alert('Cloudデータの読み込みに失敗しました。通信環境を確認してください。')}}
function reserved(id){return requests.filter(r=>r.item_id===id&&['希望','確定'].includes(r.status)).reduce((a,r)=>a+r.quantity,0)}
function render(){let q=($('search')?.value||'').toLowerCase(),f=$('filter')?.value||'all';
 $('invBody').innerHTML=inventory.map(x=>{let h=reserved(x.id),left=x.stock-h;if(!(x.item+x.variant).toLowerCase().includes(q))return'';if(f==='low'&&left>2)return'';if(f==='zero'&&left!==0)return'';if(f==='requested'&&h===0)return'';let cl=left<=0?'zero':left<=2?'low':'';return `<tr><td>${x.item}</td><td>${x.variant}</td><td class=num>${x.stock}</td><td class=num>${h}</td><td class="num ${cl}">${left}</td></tr>`}).join('');
 $('totalStock').textContent=inventory.reduce((a,x)=>a+x.stock,0);$('hopeCount').textContent=requests.filter(r=>['希望','確定'].includes(r.status)).reduce((a,r)=>a+r.quantity,0);$('shortCount').textContent=inventory.filter(x=>x.stock-reserved(x.id)<0).length;$('pendingCount').textContent=requests.filter(r=>['希望','確定'].includes(r.status)).length;
 let low=inventory.map(x=>({...x,left:x.stock-reserved(x.id)})).filter(x=>x.left<=2);$('alerts').innerHTML=low.length?`<b>⚠️ 発注・在庫確認候補 ${low.length}件</b><br><span class=muted>${low.slice(0,8).map(x=>`${x.item} ${x.variant}：残見込み ${x.left}`).join(' ／ ')}${low.length>8?' ほか':''}</span>`:'<b>在庫不足アラートはありません。</b>';
 $('manageBody').innerHTML=requests.filter(r=>r.status!=='取消').map(r=>`<tr><td>${r.affiliations?.name||''}</td><td>${r.inventory_items?.item_name||''}</td><td>${r.inventory_items?.variant||''}</td><td>${r.quantity}</td><td><span class="badge ${r.status==='希望'?'hope':r.status==='確定'?'confirmed':'done'}">${r.status}</span></td><td>${r.status==='希望'?`<button class=btn onclick="setStatus(${r.id},'確定')">確定</button>`:r.status==='確定'?`<button class="btn primary" onclick="deliver(${r.id})">☑ 受渡済</button>`:`<button class="btn danger" onclick="undoDone(${r.id})">取消・在庫復元</button>`}</td></tr>`).join('');
 $('schoolSummary').innerHTML=affiliations.map(a=>{let rs=requests.filter(r=>r.affiliation_id===a.id&&r.status==='受渡済');return `<div class=schoolcard><b>${a.name}</b><br><span style="font-size:22px;color:#0877bd">${rs.reduce((n,r)=>n+r.quantity,0)}点</span><div class=muted>${rs.length}件の受渡し</div></div>`}).join('');
 $('historyBody').innerHTML=histories.length?histories.map(h=>`<p><b>${new Date(h.created_at).toLocaleString('ja-JP')}</b>　${h.reason}：${h.inventory_items?.item_name||''} ${h.inventory_items?.variant||''} ${h.change_quantity>0?'+':''}${h.change_quantity}</p>`).join(''):'<p class=muted>まだ履歴はありません。</p>'}
async function setStatus(id,status){try{await api(`requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status,confirmed_at:status==='確定'?new Date().toISOString():null})});await loadAll()}catch(e){alert('更新に失敗しました')}}
async function deliver(id){let r=requests.find(x=>x.id===id),it=inventory.find(x=>x.id===r.item_id);if(!r||!it)return;if(it.stock<r.quantity&&!confirm('在庫数を超えています。受渡済にしますか？'))return;try{await api(`inventory_items?id=eq.${it.id}`,{method:'PATCH',body:JSON.stringify({stock:Math.max(0,it.stock-r.quantity),updated_at:new Date().toISOString()})});await api(`requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'受渡済',delivered_at:new Date().toISOString()})});await api('inventory_history',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({item_id:it.id,request_id:id,change_quantity:-r.quantity,reason:`${r.affiliations?.name||''}へ受渡し`})});await loadAll()}catch(e){console.error(e);alert('受渡し処理に失敗しました')}}
async function undoDone(id){let r=requests.find(x=>x.id===id),it=inventory.find(x=>x.id===r.item_id);if(!confirm('受渡済を取り消して在庫を戻しますか？'))return;try{await api(`inventory_items?id=eq.${it.id}`,{method:'PATCH',body:JSON.stringify({stock:it.stock+r.quantity,updated_at:new Date().toISOString()})});await api(`requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'確定',delivered_at:null,cancelled_at:new Date().toISOString()})});await api('inventory_history',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({item_id:it.id,request_id:id,change_quantity:r.quantity,reason:`取消・在庫復元（${r.affiliations?.name||''}）`})});await loadAll()}catch(e){console.error(e);alert('取消処理に失敗しました')}}
function setupAffiliations(){let old=$('school').value;$('school').innerHTML=affiliations.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');if(old)$('school').value=old}
function setupProducts(){let old=$('product').value,items=[...new Set(inventory.map(x=>x.item))];$('product').innerHTML=items.map(x=>`<option>${x}</option>`).join('');if(items.includes(old))$('product').value=old;setupVariants()}
function setupVariants(){$('variant').innerHTML=inventory.filter(x=>x.item===$('product').value).map(x=>`<option value="${x.id}">${x.variant}（在庫 ${x.stock}）</option>`).join('')}
function addToCart(){let id=Number($('variant').value),qty=Number($('qty').value),it=inventory.find(x=>x.id===id);if(!qty||qty<1)return alert('希望数を入力してください');cart.push({item_id:id,qty,item:it.item,variant:it.variant});renderCart();$('memo').value='';$('qty').value=1}
function renderCart(){$('cartBody').innerHTML=cart.length?cart.map((c,i)=>`<div class=cartrow><span>${c.item} ${c.variant}</span><b>×${c.qty}</b><button class=btn onclick="cart.splice(${i},1);renderCart()">削除</button></div>`).join(''):'まだ商品はありません。'}
async function submitCart(){if(!cart.length)return alert('商品をカートに追加してください');let aid=Number($('school').value);try{for(const c of cart)await api('requests',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({affiliation_id:aid,item_id:c.item_id,quantity:c.qty,status:'希望'})});cart=[];renderCart();await loadAll();alert('希望をまとめて送信しました')}catch(e){console.error(e);alert('送信に失敗しました')}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.tab).classList.add('on');render()});
$('search').oninput=render;$('filter').onchange=render;$('product').onchange=setupVariants;
setInterval(loadAll,10000);loadAll();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(console.error);
  });
}
</script></body></html>
